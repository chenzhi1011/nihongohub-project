<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f1e6;color:#2f2218;font-family:Arial,sans-serif;">
    <div style="max-width:520px;margin:0 auto;padding:32px 20px;">
      <div style="border:1px solid #d8c8ae;border-radius:16px;background:#fff8ec;padding:28px;text-align:center;">
        <h1 style="margin:0 0 16px;font-size:24px;color:#b3572a;">Nihongo Hub</h1>
        <p style="margin:0 0 8px;line-height:1.6;">登录验证码 / ログイン認証コード</p>
        <p style="margin:20px 0;font-size:32px;font-weight:700;letter-spacing:8px;color:#2f2218;">{{ .Token }}</p>
        <p style="margin:0;color:#6b5845;font-size:14px;line-height:1.6;">
          请在发起登录的设备中输入此验证码。<br />
          ログインを開始した端末で、この認証コードを入力してください。
        </p>
        <p style="margin:20px 0 0;color:#8f7f69;font-size:12px;line-height:1.6;">
          如果你没有请求此验证码，请忽略本邮件。<br />
          このメールに心当たりがない場合は、無視してください。
        </p>
      </div>
    </div>
  </body>
</html>
